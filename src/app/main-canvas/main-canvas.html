<!-- <canvas id="myCanvas" width="1500" height="600"></canvas> -->
<div class="lineContainer">
    <div>
        <canvas id="myCanvas"></canvas>
    </div>
    <div class="columnContainer">
        <div>
            <button type="button" class="submitButton" (click)="systemSetupHandler()" (keyup.enter)="systemSetupHandler()">
                setup & run
            </button>
            <p>Press space to stop & resume</p>
        </div> 
        <div>
            #Iterations: <p id="numIterations">0</p>
        </div>

        <label for="intervalMillisecs">Iterations every #millisecs:</label>
        <input type="number" 
            class="inputFormNumber" 
            min="1"
            id="intervalMillisecs" 
            [(ngModel)]="sysExecParms.run.intervalMillisecs" (ngModelChange)="onUpdatedParameters($event)">
<!--        [(ngModel)]="sysExecParms.run.intervalMillisecs" (ngModelChange)="onUpdateParameters($event)"> -->
    </div>
</div>
