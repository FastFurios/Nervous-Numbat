<!-- <canvas id="myCanvas" width="1500" height="600"></canvas> -->
<div class="lineContainer">
    <div>
        <canvas #myCanvas ></canvas>
    </div>
    <div>
        <div>
            <button type="button" class="submitButton" (click)="runResumeIterationsHandler()" (keyup.enter)="runResumeIterationsHandler()">
                {{ runResumeButtonLabel }}
            </button>
            <button type="button" class="submitButton" (click)="stopIterationsHandler()">
                Stop
            </button>
            <button type="button" class="submitButton" (click)="resetSystemHandler()">
                Reset
            </button>
        </div> 
        <div>
            #Iterations: {{ system?.doneIterations }}
        </div>
        <div class="lineContainerFlexStart">
            <input type="number" 
                class="inputFormNumber" 
                min="1"
                id="intervalMillisecs" 
                [(ngModel)]="sysExecParms.run.intervalMillisecs" (ngModelChange)="onUpdatedParameters($event)">
            <label for="intervalMillisecs">Iteration intervals [ms]</label>
        </div>
        <div class="lineContainerFlexStart">
            <input type="number" 
                class="inputFormNumber" 
                min="1"
                id="maxIterations" 
                [(ngModel)]="sysExecParms.run.maxIterations" (ngModelChange)="onUpdatedParameters($event)">
            <label for="intervalMillisecs">Stop after #iterations</label>
        </div>
        <div class="lineContainerFlexStart">
            <input type="number" 
                class="inputFormNumber" 
                min="0"
                max="1"
                step="0.1"
                id="minTriangleQuality" 
                [(ngModel)]="sysExecParms.run.minTriangleQuality" (ngModelChange)="onUpdatedParameters($event)">
            <label for="intervalMillisecs">Freeze when quality is beyond</label>
        </div>
        <div class="lineContainerFlexStart">
            <input type="number" 
                class="inputFormNumber" 
                min="1"
                id="maxMoveDistance" 
                [(ngModel)]="sysExecParms.run.maxMoveDistance" (ngModelChange)="onUpdatedParameters($event)">
            <label for="intervalMillisecs">Max move distance</label>
        </div>
        <div class="lineContainerFlexStart">
            <label class="switch">
                <input type="checkbox" 
                id="showActorId"
                [(ngModel)]="sysExecParms.display.showActorId" (ngModelChange)="onUpdatedParameters($event)">
                <span class="slider round"></span>
            </label>
            show actor ids 
        </div>
        <div class="lineContainerFlexStart">
            <label class="switch">
                <input type="checkbox" 
                id="showTriangle"
                [(ngModel)]="sysExecParms.display.showTriangle" (ngModelChange)="onUpdatedParameters($event)">
                <span class="slider round"></span>
            </label>
            show triangles 
        </div>
        <div class="lineContainerFlexStart">
            <label class="switch">
                <input type="checkbox" 
                id="showTriangle"
                [(ngModel)]="sysExecParms.display.showActorTriangleQuality" (ngModelChange)="onUpdatedParameters($event)">
                <span class="slider round"></span>
            </label>
            show triangle quality 
        </div>
        <div class="lineContainerFlexStart">
            <label class="switch">
                <input type="checkbox" 
                id="showActorObservees"
                [(ngModel)]="sysExecParms.display.showActorObservees" (ngModelChange)="onUpdatedParameters($event)">
                <span class="slider round"></span>
            </label>
            show observees 
        </div>
        <div class="lineContainerFlexStart">
            <label class="switch">
                <input type="checkbox" 
                id="showActorObservees"
                [(ngModel)]="sysExecParms.display.showActorGroupIdAndQuality" (ngModelChange)="onUpdatedParameters($event)">
                <span class="slider round"></span>
            </label>
            show group id & avg. quality 
        </div>
        <div class="lineContainerFlexStart">
            <label class="switch">
                <input type="checkbox" 
                id="showActorObservees"
                [(ngModel)]="sysExecParms.display.showActorJourney" (ngModelChange)="onUpdatedParameters($event)">
                <span class="slider round"></span>
            </label>
            show actors' journey 
        </div>
        #actors in ActGrp[0]= {{numActorsOfActGrp(0)! - 1 }}
        <div *ngIf="sysExecParms.display.showActorJourney" class="lineContainerFlexStart">
            <input type="number" 
                class="inputFormNumber" 
                min="-1"
                [max]="numActorsOfActGrp(0)! - 1" 
                id="maxMoveDistance" 
                [(ngModel)]="sysExecParms.display.showOneActorOnlyWithTheGivenAgIndex" (ngModelChange)="onUpdatedParameters($event)">
            <label for="showOneActorOnlyWithTheGivenAgIndex">Selected actor# (-1=all)</label>
        </div>

    </div>
</div>s
