Clock: {{ clock() }}
<div class="lineContainer">
    <div>
        <canvas #myCanvas></canvas>
    </div>
    <div [style.min-width.px]="controlPanelWidth">
        <button type="button" class="submitButton" (click)="onHome()">
            Home
        </button>
        <button type="button" class="submitButton" (click)="onFocusOnFirstActGrp()">
            Focus 1st
        </button>

        <div>Show:</div>
        <div class="lineContainerLeftStart">
            <label class="switch">
                <input type="checkbox" 
                id="showTriangle"
                [(ngModel)]="sysDisplayParms.showTriangle" (ngModelChange)="updateDisplayParms()">
                <span class="slider round"></span>
            </label>
            Triangles 
        </div>
        <div class="lineContainerLeftStart">
            <label class="switch">
                <input type="checkbox" 
                id="showActorId"
                [(ngModel)]="sysDisplayParms.showActorId" (ngModelChange)="updateDisplayParms()">
                <span class="slider round"></span>
            </label>
            Actor ids 
        </div>
        <div class="lineContainerLeftStart">
            <label class="switch">
                <input type="checkbox" 
                id="showTriangle"
                [(ngModel)]="sysDisplayParms.showActorTriangleQuality" (ngModelChange)="updateDisplayParms()">
                <span class="slider round"></span>
            </label>
            Triangle quality 
        </div>
        <div class="lineContainerLeftStart">
            <label class="switch">
                <input type="checkbox" 
                id="showActorObservees"
                [(ngModel)]="sysDisplayParms.showActorObservees" (ngModelChange)="updateDisplayParms()">
                <span class="slider round"></span>
            </label>
            Observees 
        </div>
        <div class="lineContainerLeftStart">
            <label class="switch">
                <input type="checkbox" 
                id="showActorObservees"
                [(ngModel)]="sysDisplayParms.showActorGroupIdAndQuality" (ngModelChange)="updateDisplayParms()">
                <span class="slider round"></span>
            </label>
            Group info 
        </div>
        <div class="lineContainerLeftStart">
            <label class="switch">
                <input type="checkbox" 
                id="showActorObservees"
                [(ngModel)]="sysDisplayParms.showActorJourney" (ngModelChange)="updateDisplayParms()">
                <span class="slider round"></span>
            </label>
            Journeys 
        </div>
        <div *ngIf="sysDisplayParms.showActorJourney" class="lineContainerLeftStart">
            <input type="number" 
                class="inputFormNumber" 
                min=-1
                [max]="numActorsOfActGrp(0)! - 1" 
                id="maxMoveDistance" 
                [(ngModel)]="sysDisplayParms.showOneActorOnlyWithTheGivenAgIndex" (ngModelChange)="updateDisplayParms()">
            <label for="showOneActorOnlyWithTheGivenAgIndex">Selected actor# (-1=all)</label>
        </div>
<!--        
        <div class="lineContainerLeftStart">
            <label class="switch">
                <input type="checkbox" 
                id="focusAndFollowActGrp-0"
                [(ngModel)]="sysExecParms.display.focusAndFollowActGrp0" (ngModelChange)="updateExecParms()">
                <span class="slider round"></span>
            </label>
            Focus & follow actor group 0 
        </div>
-->
    </div>
</div>
