<h2>Statistics</h2>
<table>
    <tr>
        <th>Id</th>
        <th>Quality</th>
        <th>Performance</th>
    </tr>
    @for (ag of sys.actGrps; track ag.id) {
        <tr>
            <td>{{ag.id}}</td>
            <td class="right">{{(ag.actGrpStats().avgTriangleQuality * 100).toFixed(0)}}%</td>
            <td class="right">{{ag.actGrpStats().performance.toFixed(0)}}</td>
        </tr>
    }
</table>
