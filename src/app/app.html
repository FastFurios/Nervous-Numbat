
<div class="lineContainerLeftStart">
    <img src="assets/numbat.jpg" alt="Numbat" width="60" height="60"  style="margin-right: 10px">
    <div class="columnContainer">
        <h1>Welcome to Nervous Numbat!</h1>
        <p>"Living" complex systems built by magic triangles. <small>(Version 1.0.3)</small></p>
    </div>
</div>
<div class="lineContainerFlexStart">
    <div class="lineContainerFlexStart">
        <div>
            <input type="file" class="file-input" (change)="onConfigFileSelected($event)" accept=".json" #configFileUpload>
        </div> 
        <div>
            <button type="button" class="submitButton" [disabled]="!actionsPossible().upload" [style]="!actionsPossible().upload ? greyOut : undefined" (click)="configFileUpload.click()">
                Upload
            </button>
        </div> 
    </div> 
    <div class="lineContainerFlexStart">
        <div>
            <button type="button" class="submitButton" [disabled]="!actionsPossible().ramdomize" [style]="!actionsPossible().ramdomize ? greyOut : undefined" (click)="onConfigurationByRandom()" (keyup.enter)="onConfigurationByRandom()">
                Randomize
            </button>
        </div>
        <div class="lineContainerFlexStart">
            <label for="numActGrps">#Actor Groups: </label>
            <input type="number" 
                class="inputFormNumber" 
                min=1 max=8 
                id="numActGrps" 
                [(ngModel)]="systemStructParms.numActGrps">
        </div>
        <div class="lineContainerFlexStart">
            <label for="numActorsPerActGrp">#Actors per Group: </label>
            <input type="number" 
                class="inputFormNumber" 
                min=4  
                id="numActorsPerActGrp" 
                [(ngModel)]="systemStructParms.numActorsPerActGrp">
        </div>
        <div class="lineContainerFlexStart">
            <label for="startBoxMarginPct">Start box margin %: </label>
            <input type="number" 
                class="inputFormNumber" 
                min=0 max=40 step=5
                id="startBoxMarginPct" 
                [(ngModel)]="systemStructParms.startBoxMarginPct">
        </div>
        <div class="lineContainerFlexStart">
            <label for="clustering">Clustering: </label>
            <input type="number" 
                class="inputFormNumber" 
                min=0 max=4 step="0.05"
                id="clustering" 
                [(ngModel)]="systemStructParms.clustering">
        </div>
    </div> 
    <div class="lineContainerFlexStart">
        <label for="configId">Configuration id:</label>
        <input type="text" [(ngModel)]="configurationId" #configId>
        <button type="button" class="submitButton" [disabled]="!actionsPossible().setupSystem" [style]="!actionsPossible().setupSystem ? greyOut : undefined" (click)="onSetupSystem()">
            Setup system
        </button>
        <button type="button" class="submitButton" [disabled]="!actionsPossible().downloadConfig" [style]="!actionsPossible().downloadConfig ? greyOut : undefined" (click)="onDownload()">
            Download
        </button>
        <button type="button" class="submitButton" [disabled]="!actionsPossible().discard" [style]="!actionsPossible().discard ? greyOut : undefined" (click)="onDiscard()">
            Discard
        </button>
    </div>
</div>

<div class="lineContainerFlexStart">
@if (showCanvas) {
    <main-canvas></main-canvas>
    <app-statistics></app-statistics>
}


</div>
<router-outlet></router-outlet>
